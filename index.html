<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Floor Plan Grid</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mut:#6b756f;--ac:#0f766e;--acbg:#d7efec;--bd:#d9ded9;--cv:#fff;--g1:#cdd4cc;--g2:#aeb8b0;--g3:#6f7d74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111614;--card:#1a211e;--tx:#e8eeea;--mut:#92a09a;--ac:#2dd4bf;--acbg:#14403b;--bd:#28312d;--cv:#2b332f;--g1:#43504a;--g2:#5a6a61;--g3:#93a79b}}
:root[data-theme="dark"]{--bg:#111614;--card:#1a211e;--tx:#e8eeea;--mut:#92a09a;--ac:#2dd4bf;--acbg:#14403b;--bd:#28312d;--cv:#2b332f;--g1:#43504a;--g2:#5a6a61;--g3:#93a79b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 11px;cursor:pointer;white-space:nowrap}
button.on{background:var(--acbg);border-color:var(--ac)}
.top{display:flex;gap:4px;padding:6px 6px 3px}
.top button,#bar2 button{flex:1 1 0;min-width:0;height:44px;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
.top svg,#bar2 svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#fl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
#tl{font-weight:600;color:var(--tx);white-space:nowrap}
#md{flex:1 1 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.28)}
input{font:inherit;width:62px;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
#wrap{flex:1;min-height:0;position:relative;touch-action:none;border-top:1px solid var(--bd)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#bk{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:5;touch-action:none;overscroll-behavior:none}
#sheet{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);max-height:calc(65% - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:16px 16px 0 0;padding:12px 12px 18px;display:none;z-index:6;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
body.open #bk,body.open #sheet{display:block}
.sh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.sl{font-size:12px;color:var(--mut);margin:14px 0 6px}
.rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rw>button{flex:1 1 auto}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.g4>button,.g4>input{width:100%;min-height:46px;padding:10px 2px;font-size:13px;text-align:center;margin:0;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;display:flex;align-items:center;justify-content:center}
.g4>input{padding:8px 4px;text-align:center}
.g4>button.tool-btn{border:1.5px solid #000;background:transparent;color:#000;padding:0}
.g4>button.tool-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g4>button.tool-btn.on{background:var(--acbg);border-color:var(--ac)}
.g4>button.tool-btn.on svg{fill:#000;stroke:#000}
#pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.25;padding:8px 2px;overflow:hidden;border-radius:8px;min-height:48px;border-width:1px;border-style:solid}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center}
.chip small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.chip.on{outline:3px solid var(--ac);outline-offset:-3px;border-color:transparent}
#st{font-size:12px;color:var(--mut);margin-top:12px}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bar2{display:flex;gap:4px;align-items:center;padding:0 6px 6px;flex:0 0 auto}
#bar2::-webkit-scrollbar{display:none}
#un:disabled{opacity:.5;border-color:#dc2626;color:var(--mut)}
#rd:disabled{opacity:.45}
.dimbadge{display:none;height:44px;align-items:center;justify-content:center;padding:0 10px;font:bold 13px system-ui,sans-serif;background:var(--acbg);color:var(--ac);border:1px solid var(--ac);border-radius:10px;white-space:nowrap;flex:0 0 auto;max-width:140px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.dimbadge.on{display:inline-flex}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,28,24,.92);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:20;display:none;max-width:90%;text-align:center}
#pp{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:8;align-items:center;justify-content:center;padding:14px;transition:all .2s}
body.ppo #pp{display:flex}
body.ppa #pp{display:block;background:rgba(0,0,0,.12);padding:0}
body.ppa #ppb{position:absolute;width:min(300px,62vw);max-width:none;max-height:72vh;box-shadow:0 8px 28px rgba(0,0,0,.35)}
body.ppa #ppb button{white-space:normal}
#ppb{overscroll-behavior:contain;background:var(--bg);border-radius:14px;padding:12px;width:100%;max-width:420px;max-height:80%;overflow:auto}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:5px 6px;border-top:1px solid var(--bd);flex:0 0 auto}
.tab{padding:6px 14px;font-size:13px;border-radius:8px;flex:0 0 auto;max-width:140px;overflow:hidden;text-overflow:ellipsis}
canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9;align-items:center;justify-content:center;padding:14px}
body.ovo #ov{display:flex}
.ovb{background:var(--bg);border-radius:14px;padding:12px;max-width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;width:100%;max-width:600px;box-sizing:border-box}
#imgWrap{overflow:auto;flex:1;width:100%;background:#fff;border:1px solid var(--bd);margin:8px 0;text-align:center;min-height:200px;display:block}
#oi{display:inline-block;margin:0 auto;max-width:none;max-height:none}
.btn{flex:1;text-align:center;padding:9px 11px;border:1px solid var(--ac);background:var(--acbg);color:var(--tx);border-radius:10px;text-decoration:none;font-size:14px}
body.kb-open #pp{align-items:flex-start!important;padding-top:20px!important}
body.kb-open #ppb{position:relative!important;top:auto!important;left:auto!important;margin:0 auto!important;max-height:60vh}
</style>
</head>
<body>
<div class="top">
  <button id="mn" title="Settings"></button>
  <button id="md" title="Cycle Type (Hold to pick)"></button>
  <button id="bStairsTop" title="Stairs — tap: H/V, hold: options"></button>
  <button id="bSel" title="Select (hold for Copy / Cut / Erase / Paste)"></button>
  <button id="bEr" title="Erase"></button>
</div>
<div id="bar2">
  <button id="un" title="Undo"></button><button id="rd" title="Redo"></button>
  <button id="bSv" title="Save / print / backup"></button>
  <button id="bDp" title="Duplicate sheet (hold)"></button>
  <span id="dm" class="dimbadge"></span>
    <span id="fl" hidden></span><span id="tl" hidden></span>
</div>
<div id="wrap"><canvas id="cv"></canvas><div id="dim"></div></div>
<div id="tabs"></div>
<div id="bk"></div>
<div id="sheet">
  <div class="sh"><span>Settings</span><button id="cl">Done</button></div>
  
  <div class="sl">FILE</div>
  <div class="g4">
    <input id="fnm" type="text" maxlength="30" placeholder="File name">
    <button id="frn">Rename</button>
    <button id="nfl">New file</button>
    <button id="mfl">My files</button>
  </div>
  <input type="file" id="imp" accept=".json,application/json" style="display:none">
  
  <div class="sl">BACKUP / RESTORE &amp; AREA SIZE</div>
  <div class="g4">
    <button id="bkm">Backup</button>
    <button id="imb">Import</button>
    <input id="w" type="number" inputmode="numeric" value="25" placeholder="W (ft)">
    <input id="l" type="number" inputmode="numeric" value="60" placeholder="L (ft)">
  </div>

  <div class="sl">STAIRS STEP SIZE (per step)</div>
  <div class="g4" style="margin-bottom:8px">
    <button id="ss1" class="on">1 ft</button>
    <button id="ss2">1.5 ft</button>
    <button id="ss3">2 ft</button>
    <button id="ss4">3 ft</button>
  </div>

  <div class="sl">DRAWING TOOL</div>
  <div class="g4" style="grid-template-columns:repeat(5,1fr);margin-bottom:4px">
    <button data-t="fill" class="tool-btn" title="Fill"></button>
    <button data-t="pen" class="tool-btn" title="Pen"></button>
    <button id="bStairs" class="tool-btn" title="Stairs — tap: H/V, hold: options"></button>
    <button data-t="erase" class="tool-btn" title="Erase"></button>
    <button data-t="select" class="tool-btn" title="Select"></button>
  </div>
  <div class="sl">TYPE (with area)</div>
  <div id="pal"></div>
  
  <div class="sl">ZOOM &amp; PLAN</div>
  <div class="rw" style="gap:8px;align-items:stretch;margin-bottom:16px">
    <div style="flex:1;display:flex;gap:6px;align-items:center;background:var(--card);padding:6px;border-radius:10px;border:1px solid var(--bd)">
      <button id="zm" style="flex:0;width:36px;padding:0;height:36px;border-radius:8px;font-size:16px;">&minus;</button>
      <input id="zs" type="range" min="1" max="80" value="16" style="flex:1;width:auto;padding:0;border:none;background:transparent">
      <button id="zp" style="flex:0;width:36px;padding:0;height:36px;border-radius:8px;font-size:16px;">+</button>
      <span id="zpc" style="min-width:48px;text-align:center;font-size:13px;font-weight:bold;color:var(--ac);background:var(--acbg);padding:8px 4px;border-radius:8px">100%</span>
    </div>
    <button id="clr" style="flex:1;padding:0;min-height:50px;border-radius:10px;font-size:14px;">Clear all</button>
  </div>
  
  <div id="st"></div>
  <div class="sl" id="ver"></div>
</div>

<div id="toast"></div>
<div id="pp"><div id="ppb"></div></div>
<div id="ov"><div class="ovb"><div class="sh"><span id="ot">Your plan</span></div>
  <div id="imgWrap">
    <img id="oi" alt="plan">
  </div>
  <div class="rw"><a id="oa" class="btn">Download</a><button id="oc">Close</button></div>
  <div class="sl">If Download does not work, long-press the image and choose Save image.</div></div></div>
<script>
const $=id=>document.getElementById(id);
const BUILD='2026-10-23 j',BUILD_RUN='__BUILD__';

const T=[
  {n:'Wall', c:'#374151'},
  {n:'Room', c:'#fff3c4'},
  {n:'Bath', c:'#c6f0ea'},
  {n:'Door', c:'#e0b88e'},
  {n:'Kitchen', c:'#ffdcc0'},
  {n:'Lounge', c:'#dbeafe'},
  {n:'Porch', c:'#fde68a'},
  {n:'Guest room', c:'#f3e8ff'},
  {n:'Passage', c:'#e5e7eb'},
  {n:'Window', c:'#bfe3f7'},
  {n:'Ventilator', c:'#fbd7e7'},
  {n:'Sehan', c:'#a7e8a0'},
  {n:'Lawn', c:'#d2f4d8'},
  {n:'Stairs H', c:'#bfdbfe'},
  {n:'Stairs V', c:'#bfdbfe'},
  {n:'Extra', c:'#9fd3e0'}
];

const isOpenT = v => v !== 1 && v !== 4 && v !== 10 && v !== 11 && v !== 14 && v !== 15;
const isBarT = v => v === 1 || v === 4 || v === 10 || v === 11;

const TN={pen:'Pen',fill:'Fill',erase:'Erase',select:'Select',box:'Frame'};
const I={
 set:'<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>',
 pen:'<svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>',
 fill:'<svg viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>',
 undo:'<svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
 redo:'<svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>',
 erase:'<svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>',
 select:'<svg viewBox="0 0 24 24"><path d="M3 3l7.1 17 2.5-7.4 7.4-2.5z"/><path d="M13 13l6 6"/></svg>',
 fit:'<svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>',
 dup:'<svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
 save:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>',
 box:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8v8H8z" opacity="0.25"/></svg>',
 stairsH:'<svg viewBox="0 0 24 24"><path d="M3 20v-3h4v-3h4v-3h4V8h4V5"/></svg>',
 stairsV:'<svg viewBox="0 0 24 24"><path d="M5 3h3v4h3v4h3v4h4v4h3"/></svg>'};

const HX=30,HY=30,RX=30,RY=30;
let sel=null,clip=null,pasteMode=false,gp=null,lastDraw='fill',anchor=null;
let boxes=[];
let stairs=[];
let stepSize=2; // default 1 ft (1 cell = 6 in, so 2 cells = 1 ft)
let rooms=[],typed=[],rG=null,rV=-1,gver=0,uU=null,uR=null,pv=false;
let W=25,L=60,cols=0,rows=0,g=null,sc=16,ox=HX,oy=HY,tool='fill',cur=1,hist=[],redo=[],cw=0,ch=0,rc=null,raf=0,lastZ=0,flOn=false,st=null,pz=null,CL={};
let zoomCycle = -1;
let cycleIdx = 1;
const cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('wrap');

document.addEventListener('focusin', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    setTimeout(() => { document.body.classList.add('kb-open'); }, 350);
  }
});
document.addEventListener('focusout', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    setTimeout(() => {
      if (!document.activeElement || document.activeElement.tagName !== 'INPUT') {
        document.body.classList.remove('kb-open');
      }
    }, 400);
  }
});

let ovZoom = 1;
let pvLastTap = 0;
let initialDist = 0;
let initialScale = 1;

document.getElementById('imgWrap').addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    initialScale = ovZoom;
  }
}, {passive: false});

document.getElementById('imgWrap').addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    ovZoom = Math.min(10, Math.max(0.2, initialScale * (dist / initialDist)));
    $('oi').style.width = (ovZoom * 100) + '%';
    e.preventDefault();
  }
}, {passive: false});

document.getElementById('imgWrap').addEventListener('touchend', e => {
  if (e.touches.length === 0) {
    const now = Date.now();
    if (now - pvLastTap < 300) {
      ovZoom = 1;
      $('oi').style.width = '100%';
    }
    pvLastTap = now;
  }
});

function resetZoom() {
  ovZoom = 1;
  $('oi').style.width = '100%';
}

function colors(){
  const s=getComputedStyle(document.documentElement),f=v=>s.getPropertyValue(v).trim();
  CL={cv:f('--cv'),g1:f('--g1'),g2:f('--g2'),g3:f('--g3'),card:f('--card'),mut:f('--mut'),ac:f('--ac'),tx:f('--tx')}
}
function setDims(w,l,keep){
  const nc=Math.round(w*2),nr=Math.round(l*2),ng=new Uint8Array(nc*nr);
  if(keep&&g){
    for(let r=0;r<Math.min(nr,rows);r++)
      for(let c=0;c<Math.min(nc,cols);c++){
        ng[r*nc+c]=g[r*cols+c];
      }
  }
  if(keep){
    stairs=(stairs||[]).filter(s=>s.c0<nc&&s.r0<nr).map(s=>({...s,c1:Math.min(s.c1,nc-1),r1:Math.min(s.r1,nr-1)}));
  } else {
    stairs=[];
  }
  W=w;L=l;cols=nc;rows=nr;g=ng;$('w').value=w;$('l').value=l
}
function size(){
  const d=window.devicePixelRatio||1;cw=wrap.clientWidth;ch=wrap.clientHeight;
  cv.width=cw*d;cv.height=ch*d;ctx.setTransform(d,0,0,d,0,0);
  rc=cv.getBoundingClientRect();colors();clampView();draw()
}
function clampView(){
  const aw=cw-HX-RX,ah=ch-HY-RY;
  ox=cols*sc<=aw?HX+(aw-cols*sc)/2:Math.min(HX,Math.max(cw-RX-cols*sc,ox));
  oy=rows*sc<=ah?HY+(ah-rows*sc)/2:Math.min(HY,Math.max(ch-RY-rows*sc,oy))
}
function view(s){sc=s;ox=HX;oy=HY;clampView();draw();stats()}
function fit(){sc=Math.max(1,Math.min((cw-HX-RX)/cols,(ch-HY-RY)/rows));ox=HX;oy=HY;clampView();draw();stats()}
function fitWidth(){sc=Math.max(1,(cw-HX-RX)/cols);ox=HX;oy=HY;clampView();draw();stats()}
function setZoom(n){n=Math.min(80,Math.max(1,n));const cx=cw/2,cy=ch/2,wx=(cx-ox)/sc,wy=(cy-oy)/sc;sc=n;ox=cx-wx*n;oy=cy-wy*n;clampView();draw()}
function draw(){if(!raf){raf=1;requestAnimationFrame(()=>{raf=0;render()})}}

function render(){
  ctx.clearRect(0,0,cw,ch);
  const z=Math.round(sc);
  if(z!==lastZ){lastZ=z;$('zs').value=z;const zpc=$('zpc');if(zpc)zpc.textContent=Math.round((z/16)*100)+'%';}
  const cu=hist.length>1,cr=redo.length>0;
  if(cu!==uU){uU=cu;$('un').disabled=!cu}
  if(cr!==uR){uR=cr;$('rd').disabled=!cr}
  
  ctx.save();ctx.beginPath();ctx.rect(HX,HY,cw-HX-RX,ch-HY-RY);ctx.clip();
  ctx.fillStyle=CL.cv;ctx.fillRect(ox,oy,cols*sc,rows*sc);
  const c0=Math.max(0,Math.floor(-ox/sc)),c1=Math.min(cols,Math.ceil((cw-ox)/sc)),r0=Math.max(0,Math.floor(-oy/sc)),r1=Math.min(rows,Math.ceil((ch-oy)/sc));
  
  for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++){
    const v=g[r*cols+c];
    if(v){ctx.fillStyle=T[v-1].c;ctx.fillRect(ox+c*sc,oy+r*sc,sc+0.5,sc+0.5)}
  }
  
  const gl=(step,col,lw,al)=>{
    ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();
    for(let c=Math.ceil(c0/step)*step;c<=c1;c+=step){const x=Math.round(ox+c*sc)+0.5;ctx.moveTo(x,oy+r0*sc);ctx.lineTo(x,oy+r1*sc)}
    for(let r=Math.ceil(r0/step)*step;r<=r1;r+=step){const y=Math.round(oy+r*sc)+0.5;ctx.moveTo(ox+c0*sc,y);ctx.lineTo(ox+c1*sc,y)}
    ctx.stroke();ctx.globalAlpha=1
  };
  const zt=Math.max(0,Math.min(1,(sc-6)/14));
  if(sc>=12)gl(1,CL.g1,1,0.45+0.55*zt);
  if(sc>=5)gl(2,CL.g2,1,0.2+0.8*zt);
  gl(10,CL.g3,0.8+0.8*zt,0.28+0.72*zt);

/* ---- STAIRS GROUPS: adjacent blocks (any orientation) merge; index = draw order ---- */
function stairsGroups(){
  const n=stairs.length;
  if(!n)return[];
  const parent=[...Array(n).keys()];
  const find=x=>parent[x]===x?x:parent[x]=find(parent[x]);
  const touch=(a,b)=>{
    if((a.r1+1===b.r0||b.r1+1===a.r0)&&a.c0<=b.c1&&b.c0<=a.c1)return true;
    if((a.c1+1===b.c0||b.c1+1===a.c0)&&a.r0<=b.r1&&b.r0<=a.r1)return true;
    return false;
  };
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(touch(stairs[i],stairs[j]))parent[find(i)]=find(j);
  const map=new Map();
  for(let i=0;i<n;i++){
    const gp=find(i);
    if(!map.has(gp))map.set(gp,[]);
    map.get(gp).push(i);
  }
  const out=[];
  for(const ids of map.values()){
    ids.sort((a,b)=>a-b);
    out.push(ids);
  }
  return out;
}
